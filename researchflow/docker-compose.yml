services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  backend:
    build: ./researchflow/backend
    env_file: ./researchflow/backend/.env
    ports: ["8000:8000"]
    depends_on: [mongo]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./researchflow/frontend
    ports: ["5173:80"]
    environment:
      - VITE_API_URL=http://localhost:8000